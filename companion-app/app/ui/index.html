<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Forever Friends</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Forever Friends</h1>
    <p class="status" id="status">Not connected yet</p>

    <section>
      <h2>Game folder</h2>
      <p class="value" id="folder">Not chosen yet</p>
      <button type="button" id="pick">Choose game folder&hellip;</button>
    </section>

    <footer>Version <span id="version"></span></footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
