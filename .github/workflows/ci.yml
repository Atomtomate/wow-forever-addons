name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's own packages, not a download of the Lua source: an action that fetches it failed
      # on connection resets. LuaRocks puts luacheck and busted in /usr/local/bin with a wrapper
      # that runs them under lua5.1, so .busted needs no interpreter pin.
      - name: Lua 5.1, LuaRocks, luacheck, busted
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version 5.1 install luacheck
          sudo luarocks --lua-version 5.1 install busted
      - run: luacheck addons spec --no-cache
      - run: busted --output=plainTerminal
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lua for the escaping test
        if: runner.os == 'Linux'
        run: sudo apt-get install -y lua5.1
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Cross-builds
        if: runner.os == 'Linux'
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./companion
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./companion
