name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install luacheck && luarocks install busted
      - run: luacheck addons spec --no-cache
      - run: busted --output=plainTerminal
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lua for the escaping test
        if: runner.os == 'Linux'
        run: sudo apt-get install -y lua5.1
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Cross-builds
        if: runner.os == 'Linux'
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./companion
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./companion
